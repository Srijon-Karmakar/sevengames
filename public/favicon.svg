<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <radialGradient id="og" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#ffb347"/>
      <stop offset="55%" stop-color="#ff7a1a"/>
      <stop offset="100%" stop-color="#c84500"/>
    </radialGradient>
    <filter id="f" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feComposite in="SourceGraphic" in2="b" operator="over"/>
    </filter>
  </defs>
  <rect width="64" height="64" rx="16" fill="#0d090d"/>
  <!-- Back of ring -->
  <ellipse cx="32" cy="32" rx="27" ry="10" transform="rotate(-30 32 32)" stroke="#ff9443" stroke-width="4.5" stroke-dasharray="45 60" stroke-dashoffset="18" opacity="0.85"/>
  <!-- Planet sphere -->
  <circle cx="32" cy="32" r="16" fill="url(#og)" filter="url(#f)"/>
  <!-- Front of ring -->
  <ellipse cx="32" cy="32" rx="27" ry="10" transform="rotate(-30 32 32)" stroke="#ffc27a" stroke-width="4.8" stroke-dasharray="55 65" stroke-dashoffset="55"/>
</svg>
